name: Brokket news automation

on:
  schedule:
    # Explicit off-peak minutes reduce GitHub's top-of-hour scheduler delays.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      backfill_20_days:
        description: "Run a one-time scan covering the last 20 days"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths-ignore:
      - "state/**"

permissions:
  contents: write

concurrency:
  group: brokket-news-production
  cancel-in-progress: false

jobs:
  publish-news:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEWS_API_ENDPOINT: ${{ vars.NEWS_API_ENDPOINT }}
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      NEWS_STATE_PATH: state/news-state.json
      MAX_AGE_HOURS: ${{ inputs.backfill_20_days && '480' || '72' }}
      SOURCE_BATCH_SIZE: "10000"
      MAX_ITEMS_PER_RUN: ${{ inputs.backfill_20_days && '200' || '25' }}
      MAX_ATTEMPTS_PER_RUN: ${{ inputs.backfill_20_days && '500' || '50' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify clean build
        run: pnpm build
      - id: publish
        continue-on-error: true
        run: pnpm news:run
      - name: Persist deduplication state
        if: always()
        shell: bash
        run: |
          git config user.name "brokket-news-bot"
          git config user.email "actions@users.noreply.github.com"
          cp state/news-state.json "$RUNNER_TEMP/news-state-local.json"
          git restore state/news-state.json
          git pull --rebase origin main
          pnpm state:merge "$RUNNER_TEMP/news-state-local.json" state/news-state.json
          git add state/news-state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update news automation state [skip ci]"
            git push origin HEAD:main
          fi
      - name: Report delivery failure
        if: steps.publish.outcome == 'failure'
        run: exit 1
